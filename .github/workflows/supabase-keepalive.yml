name: Supabase keep-alive

on:
  schedule:
    # Lunes y jueves a las 12:00 UTC -- dos veces por semana, margen
    # comodo frente a la ventana de inactividad del plan gratis de Supabase.
    - cron: "0 12 * * 1,4"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase PostgREST root
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/")
          echo "PostgREST respondio con status $status"
          if [ "$status" -ge 500 ]; then
            echo "Supabase respondio con un error de servidor ($status)"
            exit 1
          fi
