<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />

    <!-- SEO meta tags are fixed in English regardless of the in-app ES/EN
         selector -- this is the public "storefront" seen in search results
         and link previews before anyone has picked a language inside the app. -->
    <title>MyPinky — Authentic Dating, No Borders</title>
    <meta name="description" content="Real people, real connections. MyPinky connects cultures worldwide with no bots and no fake profiles — just authentic, borderless dating done right." />
    <link rel="canonical" href="https://mypinky.app" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="MyPinky" />
    <meta property="og:url" content="https://mypinky.app" />
    <meta property="og:title" content="MyPinky — Authentic Dating, No Borders" />
    <meta property="og:description" content="Real people, real connections. MyPinky connects cultures worldwide with no bots and no fake profiles — just authentic, borderless dating done right." />
    <meta property="og:image" content="https://mypinky.app/og-image.png" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />

    <!-- Consent Mode v2: defaults must be set before gtag.js processes any
         hit, so nothing is stored/sent beyond a cookieless ping until the
         visitor explicitly accepts via the CookieConsent banner. -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() { dataLayer.push(arguments); }
      gtag('consent', 'default', {
        ad_storage: 'denied',
        analytics_storage: 'denied',
        ad_user_data: 'denied',
        ad_personalization: 'denied'
      });
    </script>

    <script async src="https://www.googletagmanager.com/gtag/js?id=%VITE_GA_MEASUREMENT_ID%"></script>
    <script>
      gtag('js', new Date());
      // send_page_view disabled -- Analytics.jsx sends the page_view for the
      // initial load and every client-side route change, so this avoids a
      // duplicate hit for the first page.
      gtag('config', '%VITE_GA_MEASUREMENT_ID%', { send_page_view: false });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
